name: wagering-processor

x-app-env: &app-env
  DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_AUTO_CREATE_QUEUES: "true"
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ["4566:4566"]
    volumes:
      - ./docker/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    environment: *app-env
    command: ["bun", "run", "src/infrastructure/persistence/migrate.ts", "up"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: api
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    environment:
      <<: *app-env
      APP_ROLE: worker
    deploy:
      replicas: 3 # ≥ 3 concurrent instances consuming SQS, relaying the outbox and resolving references
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      localstack: { condition: service_healthy }

volumes:
  pgdata:
